# Tool fragment for TOOL=copilot (GitHub Copilot CLI).
# Installed by the bootstrap script as the *only* active fragment at:
#   ~/.config/containers/systemd/donate-clanker.container.d/10-tool.conf
#
# Mirrors the CLI_MOUNTS case for `copilot` in kubestellar/hive's Justfile
# (contribute-hive recipe). Copilot uses your existing `gh` auth (already
# mounted read-only in the base unit), so this fragment has no CLI-specific
# credential mount of its own — only the backend selector.
[Container]
Environment=AGENT_BACKEND=copilot
# Uncomment if you keep local Copilot CLI state you want the container to see:
# Volume=%h/.copilot:/home/dev/.copilot:Z
