# Tool fragment for TOOL=goose.
# Installed by the bootstrap script as the *only* active fragment at:
#   ~/.config/containers/systemd/donate-clanker.container.d/10-tool.conf
#
# Mirrors the CLI_MOUNTS case for `goose` in kubestellar/hive's Justfile
# (contribute-hive recipe). Goose is configured via env vars rather than a
# login flow (GOOSE_PROVIDER/GOOSE_MODEL). We deliberately don't use
# EnvironmentHost=true here — that would leak the *entire* host shell
# environment (including unrelated secrets) into the container. Instead the
# bootstrap script copies just those two vars into
# ~/.config/donate-clanker/secrets.env, which the base unit already loads.
[Container]
Environment=AGENT_BACKEND=goose
Volume=%h/.config/goose:/home/dev/.config/goose:Z
