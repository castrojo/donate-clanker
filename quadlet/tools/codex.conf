# Tool fragment for TOOL=codex (OpenAI Codex CLI).
# Installed by the bootstrap script as the *only* active fragment at:
#   ~/.config/containers/systemd/donate-clanker.container.d/10-tool.conf
#
# Mirrors the CLI_MOUNTS case for `codex` in kubestellar/hive's Justfile
# (contribute-hive recipe). Codex authenticates via OPENAI_API_KEY from the
# environment rather than a login flow that persists to disk, but it does
# keep session/config state under ~/.codex, so that's mounted here the same
# way ~/.claude is for claude.
[Container]
Environment=AGENT_BACKEND=codex
Volume=%h/.codex:/home/dev/.codex:Z
