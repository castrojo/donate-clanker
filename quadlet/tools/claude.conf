# Tool fragment for TOOL=claude (Claude Code).
# Installed by the bootstrap script as the *only* active fragment at:
#   ~/.config/containers/systemd/donate-clanker.container.d/10-tool.conf
#
# Mirrors the CLI_MOUNTS case for `claude` in kubestellar/hive's Justfile
# (contribute-hive recipe).
[Container]
Environment=AGENT_BACKEND=claude
Volume=%h/.claude:/home/dev/.claude:Z
Volume=%h/.config/claude-code:/home/dev/.config/claude-code:Z
