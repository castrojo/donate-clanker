# Keep pane capabilities distinct from the terminal attached by the reviewer.
# The entrypoint preserves the latter when the image has its terminfo.
# tmux-direct makes 24-bit color a terminfo fact: panes advertise
# colors#0x1000000 and tmux passes RGB through to clients that support it,
# downsampling only for weaker ones. For a host TERM the image does not
# know, the entrypoint falls back to xterm-direct when the caller advertises
# COLORTERM=truecolor and to xterm-256color otherwise.
set -g default-terminal "tmux-direct"

# Goose's renderer checks COLORTERM before emitting 24-bit sequences. Podman
# does not pass the host's COLORTERM through, so set it for panes; tmux
# adapts the output to whatever the attach client actually supports.
set-environment -g COLORTERM "truecolor"

# Wheel-up enters copy mode, making long Hive and Goose output readable.
set -g mouse on

# tmux keeps 2000 lines per pane by default, and a working agent turn overruns
# that in minutes: a post-mortem `capture-pane -S -30000` returned only the
# last 2019 lines, so the start of a task was already unrecoverable. Hive only
# ever ships the last few lines to the hub, which makes this pane the sole
# record a human can scroll back through.
set -g history-limit 50000
