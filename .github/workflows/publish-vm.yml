name: validate VM artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-vm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # The VM runner artifacts are published out of band, and the repository
    # variables naming them are unset until that happens. Until then there is
    # nothing to verify: the launcher already refuses the VM path outright
    # unless DONATE_CLANKER_VM_RUNNER_IMAGE is set, so an unset ref means the
    # feature is not shipped, not that a signature check was skipped. Failing
    # every release tag on absent configuration teaches people to ignore a red
    # release pipeline, which is worse than skipping honestly.
    #
    # This guards on the runner ref alone on purpose: once it is configured
    # the job runs, and verify-vm-artifacts.sh still fails hard on any other
    # ref or cosign identity that is missing or unverifiable.
    if: vars.DONATE_CLANKER_VM_RUNNER_REF != ''
    env:
      VM_RUNNER_REF: ${{ vars.DONATE_CLANKER_VM_RUNNER_REF }}
      VM_GUEST_REF: ${{ vars.DONATE_CLANKER_VM_GUEST_REF }}
      VM_GUEST_KERNEL_REF: ${{ vars.DONATE_CLANKER_VM_GUEST_KERNEL_REF }}
      VM_GUEST_INITRAMFS_REF: ${{ vars.DONATE_CLANKER_VM_GUEST_INITRAMFS_REF }}
      VM_GUEST_ROOTFS_REF: ${{ vars.DONATE_CLANKER_VM_GUEST_ROOTFS_REF }}
      COSIGN_CERT_IDENTITY_REGEXP: ${{ vars.DONATE_CLANKER_VM_COSIGN_IDENTITY_REGEXP }}
      COSIGN_CERT_ISSUER: ${{ vars.DONATE_CLANKER_VM_COSIGN_ISSUER }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate external VM artifacts
        run: scripts/verify-vm-artifacts.sh
