name: publish compatibility image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-compat-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/projectbluefin/donate-clanker

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          STABLE_POLICY: ${{ vars.DONATE_CLANKER_PUBLISH_STABLE }}
        run: |
          set -euo pipefail
          {
            echo "sha=sha-${GITHUB_SHA}"
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              version="${GITHUB_REF_NAME#v}"
              printf 'version=%s\n' "$version"
              printf 'version_tag=%s\n' "$GITHUB_REF_NAME"
              echo "${IMAGE}:$version"
              echo "${IMAGE}:$GITHUB_REF_NAME"
              if [[ "${STABLE_POLICY,,}" == true ]]; then
                echo 'stable=true'
                echo "${IMAGE}:stable"
              else
                echo 'stable=false'
              fi
            else
              echo 'version='
              echo 'version_tag='
              echo 'stable=false'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build compatibility image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Containerfile
          load: true
          tags: donate-clanker-compat:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test compatibility image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect donate-clanker-compat:smoke --format '{{.Config.User}}')" = dev
          test "$(docker inspect donate-clanker-compat:smoke --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/donate-clanker-entrypoint"]'
          test "$(docker inspect donate-clanker-compat:smoke --format '{{.Config.WorkingDir}}')" = /workspace
          docker run --rm --entrypoint /bin/sh donate-clanker-compat:smoke -c '
            set -eu
            test -x /usr/local/bin/donate-clanker-entrypoint
            test ! -S /var/run/docker.sock
            test ! -S /run/podman/podman.sock
          '
          smoke_dir="$RUNNER_TEMP/compat-smoke-config"
          mkdir -p "$smoke_dir"
          printf '%s\n' \
            'HIVE_REGISTRATION_TOKEN=test-token' \
            'AGENT_BACKEND=definitely-missing-cli' \
            'HIVE_HUB=wss://example.invalid/contribute' \
            > "$smoke_dir/contributor.env"
          set +e
          output="$(docker run --rm \
            -v "$smoke_dir:/config/hive:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            donate-clanker-compat:smoke 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq 'definitely-missing-cli CLI not found.' <<<"$output"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image tags
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version || steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published digest
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          echo "Published $IMAGE@$DIGEST"
          {
            echo "### Compatibility image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Immutable tag: \`$IMAGE:${{ steps.tags.outputs.sha }}\`"
            if [[ -n "${{ steps.tags.outputs.version }}" ]]; then
              echo "Version tag: \`$IMAGE:${{ steps.tags.outputs.version }}\`"
            fi
            if [[ "${{ steps.tags.outputs.stable }}" == true ]]; then
              echo "Stable alias: \`$IMAGE:stable\` (explicitly enabled by repository policy)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
