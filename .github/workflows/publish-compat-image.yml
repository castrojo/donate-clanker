name: publish compatibility image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-compat-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/projectbluefin/donate-clanker

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sha=sha-${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              version="${GITHUB_REF_NAME#v}"
              printf 'version=%s\n' "$version"
              printf 'version_tag=%s\n' "$GITHUB_REF_NAME"
            else
              echo 'version='
              echo 'version_tag='
            fi
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo 'stable=true'
            else
              echo 'stable=false'
            fi
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "${IMAGE}:$version"
              echo "${IMAGE}:$GITHUB_REF_NAME"
              echo "${IMAGE}:stable"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build compatibility image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          load: true
          tags: donate-clanker-compat:smoke
          build-args: |
            GOOSE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect compatibility image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect donate-clanker-compat:smoke --format '{{.Config.User}}')" = dev
          test "$(docker inspect donate-clanker-compat:smoke --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/donate-clanker-entrypoint"]'
          # /home/dev, not /workspace: there is no workspace mount any more.
          test "$(docker inspect donate-clanker-compat:smoke --format '{{.Config.WorkingDir}}')" = /home/dev

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image tags
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GOOSE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version || steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published digest
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          echo "Published $IMAGE@$DIGEST"
          {
            echo "### Compatibility image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Immutable tag: \`$IMAGE:${{ steps.tags.outputs.sha }}\`"
            if [[ -n "${{ steps.tags.outputs.version }}" ]]; then
              echo "Version tag: \`$IMAGE:${{ steps.tags.outputs.version }}\`"
            fi
            if [[ "${{ steps.tags.outputs.stable }}" == true ]]; then
              echo "Stable alias: \`$IMAGE:stable\` (explicitly enabled by repository policy)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
