name: publish compatibility image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Branch builds are a moving pointer, so a superseded run has nothing left to
# publish and is cancelled. Tag builds are a release and must never be
# cancelled: 'refs/tags/*' evaluates this to false.
concurrency:
  group: publish-compat-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/projectbluefin/donate-clanker

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          # Two shapes, decided by the ref alone:
          #   refs/heads/main  every merge: both architectures, 'sha-<commit>'
          #                     + ':stable'
          #   refs/tags/v*     release: both architectures, version tags + ':stable'
          #   anything else    dispatch from a side branch: 'sha-' only
          #
          # ':stable' moves on every merge on purpose. This is a development
          # tool whose contributors are the people changing it, so the tag
          # they run has to mean 'what the repository says now'. Publishing it
          # only on release tags is what left a contributor running days-old
          # code and hitting bugs that were already fixed on main.
          release=false
          main=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release=true
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            main=true
          fi
          {
            echo "sha=sha-${GITHUB_SHA}"
            if [[ "$release" == true ]]; then
              version="${GITHUB_REF_NAME#v}"
              printf 'version=%s\n' "$version"
              printf 'version_tag=%s\n' "$GITHUB_REF_NAME"
              echo 'stable=true'
              # Stable is the launcher default, so it always remains
              # multi-architecture.
              echo 'platforms=linux/amd64,linux/arm64'
            else
              echo 'version='
              echo 'version_tag='
              printf 'stable=%s\n' "$main"
              if [[ "$main" == true ]]; then
                # Stable moves on every merge and must remain usable on arm64.
                echo 'platforms=linux/amd64,linux/arm64'
              else
                # A manual side-branch build never moves the default tag.
                echo 'platforms=linux/amd64'
              fi
            fi
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [[ "$release" == true ]]; then
              echo "${IMAGE}:$version"
              echo "${IMAGE}:$GITHUB_REF_NAME"
            fi
            if [[ "$release" == true || "$main" == true ]]; then
              echo "${IMAGE}:stable"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build compatibility image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: image/Containerfile
          load: true
          tags: donate-clanker-compat:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect compatibility image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect donate-clanker-compat:smoke --format '{{.Config.User}}')" = dev
          test "$(docker inspect donate-clanker-compat:smoke --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/donate-clanker-entrypoint"]'
          # /home/dev, not /workspace: there is no workspace mount any more.
          test "$(docker inspect donate-clanker-compat:smoke --format '{{.Config.WorkingDir}}')" = /home/dev
          docker run --rm --user root --entrypoint /usr/bin/bash \
            donate-clanker-compat:smoke -lc '
              set -euo pipefail
              test -x /opt/node/bin/node
              test -f /opt/node/LICENSE
              test ! -e /opt/node/include
              test ! -e /opt/node/lib
              test ! -e /root/.npm
              ! command -v npm
              test -s /home/dev/.agents/AGENTS.md
              shopt -s nullglob
              skill_docs=(/home/dev/.agents/skills/*/SKILL.md)
              ((${#skill_docs[@]} > 0))
              node --version
              gh --version
              tmux -V
              goose --version
            '

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image tags
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: image/Containerfile
          push: true
          platforms: ${{ steps.tags.outputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version || steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published digest
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          echo "Published $IMAGE@$DIGEST"
          {
            echo "### Compatibility image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Immutable tag: \`$IMAGE:${{ steps.tags.outputs.sha }}\`"
            echo "Platforms: \`${{ steps.tags.outputs.platforms }}\`"
            if [[ -n "${{ steps.tags.outputs.version }}" ]]; then
              echo "Version tag: \`$IMAGE:${{ steps.tags.outputs.version }}\`"
            fi
            if [[ "${{ steps.tags.outputs.stable }}" == true ]]; then
              echo "Stable alias: \`$IMAGE:stable\` now points at this build"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
