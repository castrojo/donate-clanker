name: publish review image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  # Hourly canary tracking: Goose's `canary` tag moves without any commit
  # here, and ':stable' only picked it up on the next merge. Scheduled runs
  # still skip the build when the published image already carries the
  # current asset digests.
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

# Branch builds are a moving pointer, so a superseded run has nothing left to
# publish and is cancelled. Tag builds are a release and must never be
# cancelled: 'refs/tags/*' evaluates this to false.
concurrency:
  group: publish-review-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  IMAGE: ghcr.io/projectbluefin/review

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          # Two shapes, decided by the ref alone:
          #   refs/heads/main  every merge: both architectures, 'sha-<commit>'
          #                     + ':stable'
          #   refs/tags/v*     release: both architectures, version tags + ':stable'
          #   anything else    dispatch from a side branch: both architectures,
          #                     'sha-' only
          #
          # ':stable' moves on every merge on purpose. This is a development
          # tool whose contributors are the people changing it, so the tag
          # they run has to mean 'what the repository says now'. Publishing it
          # only on release tags is what left a contributor running days-old
          # code and hitting bugs that were already fixed on main.
          release=false
          main=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release=true
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            main=true
          fi
          {
            echo "sha=sha-${GITHUB_SHA}"
            if [[ "$release" == true ]]; then
              version="${GITHUB_REF_NAME#v}"
              printf 'version=%s\n' "$version"
              printf 'version_tag=%s\n' "$GITHUB_REF_NAME"
              echo 'stable=true'
              # Stable is the launcher default, so it always remains
              # multi-architecture.
              echo 'platforms=linux/amd64,linux/arm64'
            else
              echo 'version='
              echo 'version_tag='
              printf 'stable=%s\n' "$main"
              # Every published digest is a complete contributor artifact.
              # Side-branch dispatches do not move stable, but still publish
              # the same two native platforms as release and main builds.
              echo 'platforms=linux/amd64,linux/arm64'
            fi
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [[ "$release" == true ]]; then
              echo "${IMAGE}:$version"
              echo "${IMAGE}:$GITHUB_REF_NAME"
            fi
            if [[ "$release" == true || "$main" == true ]]; then
              echo "${IMAGE}:stable"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Derive review image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          base_image="$(sed -n 's/^ARG FSDK_RUNNER_IMAGE=\(.*\)$/\1/p' image/Containerfile)"
          test -n "$base_image"
          test "${base_image#*@}" != "$base_image"
          {
            printf 'created=%s\n' "$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
            printf 'base_name=%s\n' "${base_image%@*}"
            printf 'base_digest=%s\n' "${base_image#*@}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve official Goose canary asset identities
        id: goose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api repos/aaif-goose/goose/releases/tags/canary)"
          asset_digest() {
            jq -er --arg name "$1" \
              '.assets[] | select(.name == $name) | .digest |
               select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")' \
              <<<"$release"
          }
          {
            echo "x86_64_sha256=$(asset_digest goose-x86_64-unknown-linux-musl.tar.gz)"
            echo "aarch64_sha256=$(asset_digest goose-aarch64-unknown-linux-musl.tar.gz)"
          } >>"$GITHUB_OUTPUT"

      - name: Skip scheduled builds when stable already tracks this snapshot
        id: current
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          # GHCR serves public package manifests to an anonymous pull token.
          # A lookup failure resolves to "build": a pointless republish is
          # cheap, a skipped refresh is the defect this schedule exists to fix.
          published="$(
            token="$(curl -fsS "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY}:pull" | jq -er .token)"
            auth="Authorization: Bearer ${token}"
            base="https://ghcr.io/v2/${GITHUB_REPOSITORY}"
            index_accept="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json"
            manifest_accept="application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
            index="$(curl -fsS -H "$auth" -H "Accept: ${index_accept}" "$base/manifests/stable")"
            amd64="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest][0]' <<<"$index")"
            config="$(curl -fsS -H "$auth" -H "Accept: ${manifest_accept}" "$base/manifests/${amd64}" | jq -er .config.digest)"
            curl -fsSL -H "$auth" "$base/blobs/${config}" \
              | jq -er '.config.Labels["io.projectbluefin.review.goose.x86_64-unknown-linux-musl.sha256"]'
          )" || published=""
          if [[ "$published" == "${{ steps.goose.outputs.x86_64_sha256 }}" ]]; then
            echo "stable already carries goose snapshot ${published}; nothing to publish."
            echo "refresh_needed=false" >>"$GITHUB_OUTPUT"
          else
            echo "stable carries '${published:-unreadable}', canary is at ${{ steps.goose.outputs.x86_64_sha256 }}; building."
            echo "refresh_needed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Build review image for smoke test
        if: steps.current.outputs.refresh_needed != 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: image/Containerfile
          load: true
          tags: review:smoke
          build-args: |
            GOOSE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            GOOSE_X86_64_SHA256=${{ steps.goose.outputs.x86_64_sha256 }}
            GOOSE_AARCH64_SHA256=${{ steps.goose.outputs.aarch64_sha256 }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect review image
        if: steps.current.outputs.refresh_needed != 'false'
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect review:smoke --format '{{.Config.User}}')" = dev
          test "$(docker inspect review:smoke --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/review-entrypoint"]'
          # /home/dev, not /workspace: there is no workspace mount any more.
          test "$(docker inspect review:smoke --format '{{.Config.WorkingDir}}')" = /home/dev
          # The lean FSDK base has no terminal database. The entrypoint needs
          # the 256color attach entry and panes run the direct-color entry.
          docker run --rm --entrypoint /usr/bin/bash review:smoke \
            -lc 'TERM=xterm-256color infocmp xterm-256color >/dev/null; infocmp tmux-direct >/dev/null; TERM=xterm-256color tmux new-session -d -s terminfo-smoke "sleep 30"; tmux has-session -t terminfo-smoke; test "$(tmux show -gv default-terminal)" = tmux-direct; tmux kill-session -t terminfo-smoke'

      - name: Log in to GHCR
        if: steps.current.outputs.refresh_needed != 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image tags
        if: steps.current.outputs.refresh_needed != 'false'
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: image/Containerfile
          push: true
          platforms: ${{ steps.tags.outputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GOOSE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
            GOOSE_X86_64_SHA256=${{ steps.goose.outputs.x86_64_sha256 }}
            GOOSE_AARCH64_SHA256=${{ steps.goose.outputs.aarch64_sha256 }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels: |
            org.opencontainers.image.title=Bluefin review contributor
            org.opencontainers.image.description=Foreground contributor runtime for projectbluefin/review.
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version || steps.tags.outputs.sha }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.base.name=${{ steps.metadata.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.metadata.outputs.base_digest }}
          annotations: |
            index:org.opencontainers.image.title=Bluefin review contributor
            index:org.opencontainers.image.description=Foreground contributor runtime for projectbluefin/review.
            index:org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.tags.outputs.version || steps.tags.outputs.sha }}
            index:org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.base.name=${{ steps.metadata.outputs.base_name }}
            index:org.opencontainers.image.base.digest=${{ steps.metadata.outputs.base_digest }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published review image digest
        if: steps.current.outputs.refresh_needed != 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Install image audit tooling
        if: steps.current.outputs.refresh_needed != 'false'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Audit published image composition and attestations
        if: steps.current.outputs.refresh_needed != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DERIVED_IMAGE: ${{ env.IMAGE }}@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          bash tests/image-audit.sh \
            --derived "$DERIVED_IMAGE" \
            --require-oci \
            --require-attestations \
            --require-github-attestation \
            --attestation-repository "${GITHUB_REPOSITORY}" \
            --expected-source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --expected-revision "${GITHUB_SHA}" \
            --expected-version "${{ steps.tags.outputs.version || steps.tags.outputs.sha }}"

      - name: Verify published digest
        if: steps.current.outputs.refresh_needed != 'false'
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          echo "Published $IMAGE@$DIGEST"
          {
            echo "### Review image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Immutable tag: \`$IMAGE:${{ steps.tags.outputs.sha }}\`"
            echo "Platforms: \`${{ steps.tags.outputs.platforms }}\`"
            if [[ -n "${{ steps.tags.outputs.version }}" ]]; then
              echo "Version tag: \`$IMAGE:${{ steps.tags.outputs.version }}\`"
            fi
            if [[ "${{ steps.tags.outputs.stable }}" == true ]]; then
              echo "Stable alias: \`$IMAGE:stable\` now points at this build"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
