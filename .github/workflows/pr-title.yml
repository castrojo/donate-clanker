# Enforce Conventional Commits on the PR title.
#
# The repository merges with squash only, so the squash commit subject is
# inherited from the PR title — a bad title becomes permanent history.
name: pr-title

# pull_request_target is used ONLY because this job never checks out or
# executes pull request code: it reads the PR title from the event payload
# and nothing else. Do not add a checkout step here.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            ci
            build
            revert
