# Gate the kubestellar/hive pin on an actual protocol delta.
#
# Renovate can bump the Hive SHA, but it has no concept of file contents, so it
# cannot tell a pure pin move from a contributor-protocol change. renovate.json
# therefore disables automerge for the `kubestellar/hive` dep, and this workflow
# re-enables GitHub-native auto-merge only when none of the Hive files this repo
# actually consumes changed between the old and the new SHA.
#
# 'pull_request' and NOT 'pull_request_target', deliberately, for two reasons:
#
#  1. Same reason as pr-title.yml: a pull_request_target workflow only ever runs
#     the default branch's copy of the file, so the pull request that introduces
#     or edits this gate could never exercise the version it is proposing.
#  2. pull_request_target would hand a write-scoped token to a job that reads
#     the head branch's image/Containerfile. That combination is the classic
#     privilege-escalation shape. With 'pull_request' the head-branch content is
#     read under a token that is read-only for forks, and write only for
#     same-repository branches — which is exactly where Renovate's branches live.
#
# Unlike pr-title.yml this job does check out the head ref, because deriving the
# consumed-file list from image/Containerfile requires reading it. It never
# executes head-branch code: every use of the checkout is text extraction with
# sed/grep, and the only commands run are git, gh, and coreutils.
name: hive pin gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Read the repo, comment/label/auto-merge the pull request. Labels are issue
# labels, hence 'issues: write' alongside 'pull-requests: write'.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: hive-pin-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HIVE_REPO: kubestellar/hive
  REVIEW_LABEL: hive-protocol-change

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The pin lives in justfile, image/Containerfile and README.md and must
      # move atomically; tests/image-contract.sh and validate.yml already fail a
      # partial bump, so reading the launcher pin alone is sufficient here.
      - name: Extract old and new Hive pins
        id: pins
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          extract() { sed -n 's/^hive_commit := "\([0-9a-f]\{40\}\)"$/\1/p'; }

          # fetch-depth: 0 already brings the base commit down; the explicit
          # fetch is only a fallback and must not fail the job on its own.
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
            git fetch --no-tags --quiet origin "$BASE_SHA"
          old="$(git show "${BASE_SHA}:justfile" | extract)"
          new="$(extract < justfile)"

          if [ -z "$old" ] || [ -z "$new" ]; then
            echo "::error::could not read hive_commit from justfile at base and head"
            exit 1
          fi
          {
            echo "old=${old}"
            echo "new=${new}"
            echo "changed=$([ "$old" = "$new" ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
          echo "old=${old} new=${new}"

      # Derived, never hardcoded: a fourth consumed Hive file added later must
      # be gated automatically rather than silently skipped.
      - name: Derive consumed Hive files from image/Containerfile
        id: files
        if: steps.pins.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # SC2016: the ${HIVE_COMMIT} in the pattern is a literal Containerfile
          # substring, not a shell expansion. \K drops the matched prefix so the
          # repository-relative path is all that is emitted.
          # shellcheck disable=SC2016
          paths="$(
            grep -oP 'https://raw\.githubusercontent\.com/kubestellar/hive/\$\{HIVE_COMMIT\}/\K[A-Za-z0-9._/-]+' \
              image/Containerfile | sort -u
          )"
          if [ -z "$paths" ]; then
            echo "::error file=image/Containerfile::no pinned kubestellar/hive file URLs found; the gate cannot verify this bump"
            exit 1
          fi
          echo "consumed Hive files:"
          echo "$paths"
          {
            echo 'paths<<EOF'
            echo "$paths"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Blob SHA comparison first: one cheap API call per file per ref, and the
      # contents are only downloaded for the files that actually differ.
      - name: Compare consumed files across the pin move
        id: compare
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.pins.outputs.old }}
          NEW: ${{ steps.pins.outputs.new }}
          PATHS: ${{ steps.files.outputs.paths }}
        run: |
          set -euo pipefail
          blob() { gh api "repos/${HIVE_REPO}/contents/$1?ref=$2" --jq .sha 2>/dev/null || echo MISSING; }
          raw() { gh api "repos/${HIVE_REPO}/contents/$1?ref=$2" -H 'Accept: application/vnd.github.raw' 2>/dev/null || true; }

          report="${RUNNER_TEMP}/hive-pin-gate.md"
          {
            echo "### Hive pin gate"
            echo
            echo "\`${OLD}\` → \`${NEW}\`"
            echo
          } > "$report"

          changed=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            before="$(blob "$path" "$OLD")"
            after="$(blob "$path" "$NEW")"
            if [ "$before" = "$after" ]; then
              echo "unchanged: ${path}"
              continue
            fi
            changed=true
            echo "CHANGED: ${path} (${before} -> ${after})"
            raw "$path" "$OLD" > "${RUNNER_TEMP}/old"
            raw "$path" "$NEW" > "${RUNNER_TEMP}/new"
            {
              echo "<details open><summary><code>${path}</code></summary>"
              echo
              echo '```diff'
              diff -u --label "a/${path}" --label "b/${path}" \
                "${RUNNER_TEMP}/old" "${RUNNER_TEMP}/new" | head -c 40000 || true
              echo '```'
              echo
              echo "</details>"
              echo
            } >> "$report"
          done <<< "$PATHS"

          if [ "$changed" = false ]; then
            echo "No consumed Hive file changed: pure pin move." >> "$report"
          else
            echo "Consumed Hive runtime files changed. Auto-merge withheld; review the delta above before merging." >> "$report"
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "report=${report}" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge (pure pin move)
        if: steps.pins.outputs.changed == 'true' && steps.compare.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --auto --squash ||
            echo "::warning::could not enable auto-merge; merge manually once checks pass"

      - name: Report protocol delta and require review
        if: steps.pins.outputs.changed == 'true' && steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ steps.compare.outputs.report }}
        run: |
          set -euo pipefail
          gh label create "$REVIEW_LABEL" --force \
            --color B60205 \
            --description 'Hive pin bump changes a consumed contributor runtime file'
          gh pr edit "$PR" --add-label "$REVIEW_LABEL"
          gh pr comment "$PR" --body-file "$REPORT" --edit-last --create-if-none ||
            gh pr comment "$PR" --body-file "$REPORT"
          echo "::error::the Hive pin bump changes consumed contributor runtime files; human review required"
          exit 1
