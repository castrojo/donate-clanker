name: validate

# just/61-donate-clanker.just is the shipped launcher. This workflow validates
# its Bash syntax, VM contract, compatibility image, and mocked attended
# selection flow without requiring a live Hive account or interactive terminal.

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      # pre-commit/action is maintenance-only upstream, so run pre-commit
      # directly instead.
      - name: Static hygiene
        run: |
          set -euo pipefail
          python -m pip install --upgrade pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Gofmt cleanliness
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"

      - name: Go tests
        run: |
          set -euo pipefail
          go test ./...

      - name: Go vet
        run: |
          set -euo pipefail
          go vet ./...

      - name: Skill frontmatter and index stay aligned
        run: |
          set -euo pipefail
          bash scripts/check-skill-frontmatter.sh

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Justfile parses
        run: |
          set -euo pipefail
          just --justfile just/61-donate-clanker.just --list

      - name: Guided Goose onboarding behavior
        run: |
          set -euo pipefail
          bash tests/just-onboarding.sh

      - name: VM boot harness host seam
        run: |
          set -euo pipefail
          python3 tests/vm-boot-e2e.py --self-test

      - name: Recipe bodies are valid bash
        run: |
          set -euo pipefail
          # Recipe headers in this file look like 'donate-clanker:',
          # 'donate-clanker-doctor:' — a bare identifier + colon at column 0,
          # no parameters. Grab every indented line following one, until the
          # next non-indented, non-comment, non-blank line (next recipe or
          # variable declaration).
          awk '
            /^[a-zA-Z][a-zA-Z0-9_-]*:$/ { flag=1; next }
            /^[^ \t#]/ { flag=0 }
            flag { print }
          ' just/61-donate-clanker.just > recipe_bodies.sh
          bash -n recipe_bodies.sh
          rm -f recipe_bodies.sh

      - name: VM artifact contract
        run: |
          set -euo pipefail
          VM_VERIFY_REMOTE=false \
          VM_RUNNER_REF=ghcr.io/example/runner@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          VM_GUEST_REF=ghcr.io/example/guest@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          VM_GUEST_KERNEL_REF=ghcr.io/example/kernel@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
          VM_GUEST_INITRAMFS_REF=ghcr.io/example/initramfs@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd \
          VM_GUEST_ROOTFS_REF=ghcr.io/example/rootfs@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee \
          scripts/verify-vm-artifacts.sh

      - name: Context7 image contract — goose.yaml and policy
        run: |
          set -euo pipefail
          GOOSE_YAML="image/config/goose.yaml"
          POLICY_MD="image/config/local-agent-policy.md"
          fail=0

          # Required lines in goose.yaml that prove Context7 is configured as
          # an enabled streamable HTTP MCP extension.
          for want in \
            "bundled: false" \
            "enabled: true" \
            "name: context7" \
            "timeout: 30" \
            "type: streamable_http" \
            'uri: "https://mcp.context7.com/mcp"'; do
            if ! grep -qF "$want" "$GOOSE_YAML"; then
              echo "::error file=${GOOSE_YAML}::missing required line: $want"
              fail=1
            fi
          done

          # The local-agent policy must contain an opportunistic-use phrase and
          # a local-fallback phrase so agents do not block on Context7.
          for want in \
            "inspect local repository evidence first" \
            "Context7 only when current external documentation is useful" \
            "continue with local evidence when Context7 is unavailable"; do
            if ! grep -qF "$want" "$POLICY_MD"; then
              echo "::error file=${POLICY_MD}::missing required phrase: $want"
              fail=1
            fi
          done

          exit "$fail"

      - name: Interactive launcher docs and shell stay aligned
        run: |
          set -euo pipefail
          # The sed and grep patterns intentionally contain literal
          # dollar-sign syntax for the embedded shell checks.
          # shellcheck disable=SC2016
          HIVE_PIN="$(sed -n 's/^hive_commit := "\(.*\)"$/\1/p' just/61-donate-clanker.just)"
          test -n "$HIVE_PIN"
          grep -Fq 'LAST_GOOSE_PROVIDER' just/61-donate-clanker.just
          grep -Fq 'last-selections.env' just/61-donate-clanker.just
          grep -Fq 'secrets.env' just/61-donate-clanker.just
          # shellcheck disable=SC2016
          grep -Fq 'fetch --depth 1 origin "$HIVE_COMMIT"' just/61-donate-clanker.just
          grep -Fq 'DONATE_CLANKER_HIVE_COMMIT' just/61-donate-clanker.just
          grep -Fq 'Run: goose configure' just/61-donate-clanker.just
          grep -Fq "$HIVE_PIN" README.md
          grep -Fq 'DONATE_CLANKER_HIVE_COMMIT' README.md
          grep -Fq 'last-selections.env' README.md
          grep -Fq 'secrets.env' README.md

      - name: Compatibility image contract and build
        run: |
          set -euo pipefail
          docker build -f image/Containerfile -t donate-clanker-compat:test .
          test "$(docker inspect donate-clanker-compat:test --format '{{.Config.User}}')" = "dev"
          test "$(docker inspect donate-clanker-compat:test --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/donate-clanker-entrypoint"]'
          # /home/dev, not /workspace: there is no workspace mount any more —
          # the agent clones what it needs inside the disposable guest, and
          # Hive's config lives under the image's home.
          test "$(docker inspect donate-clanker-compat:test --format '{{.Config.WorkingDir}}')" = "/home/dev"

      # The launcher is interactive by design. CI validates image metadata and
      # the build-time Goose command checks; attended use validates runtime.
