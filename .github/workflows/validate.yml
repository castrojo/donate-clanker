name: validate

# just/61-donate-clanker.just is the shipped launcher. This workflow validates
# its Bash syntax and the mocked attended selection flow without requiring a
# live Hive account, host container engine, or interactive terminal.

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Static hygiene
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Gofmt cleanliness
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"

      - name: Agent contract manifest stays aligned
        run: |
          set -euo pipefail
          MANIFEST="image/config/agent-contract.json"
          fail=0

          require_manifest_value() {
            local filter="$1"
            local kind="$2"
            local want="$3"
            if ! jq -e --arg want "$want" "$filter" "$MANIFEST" >/dev/null; then
              echo "::error file=${MANIFEST}::missing required ${kind}: $want"
              fail=1
            fi
          }

          if ! jq -e '.version == 1' "$MANIFEST" >/dev/null; then
            echo "::error file=${MANIFEST}::missing or unsupported version"
            fail=1
          fi

          for want in \
            "AGENTS.md" \
            "docs/SKILL.md" \
            "docs/skills/skill-improvement.md"; do
            require_manifest_value \
              '.required_documents | any(.path == $want)' \
              "document path" \
              "$want"
          done

          for want in \
            "Read AGENTS.md first, then docs/SKILL.md." \
            "If you discover a durable workaround, pattern, or convention, update the nearest docs/skills/*.md file in the same change." \
            "Use the repository validation command family: go test ./..., git diff --check, gofmt -l ., just --justfile just/61-donate-clanker.just --list."; do
            require_manifest_value '.rules | any(. == $want)' "rule" "$want"
          done

          for want in \
            "go test ./..." \
            "git diff --check" \
            "gofmt -l ." \
            "just --justfile just/61-donate-clanker.just --list"; do
            require_manifest_value \
              '.validation_commands | any(. == $want)' \
              "validation command" \
              "$want"
          done

          exit "$fail"

      - name: Go tests
        run: |
          set -euo pipefail
          go test ./...

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Justfile parses
        run: |
          set -euo pipefail
          just --justfile just/61-donate-clanker.just --list

      - name: Guided Goose onboarding behavior
        run: |
          set -euo pipefail
          bash tests/just-onboarding.sh

      - name: Recipe bodies are valid bash
        run: |
          set -euo pipefail
          # Recipe headers in this file look like 'donate-clanker:',
          # 'donate-clanker-doctor:' — a bare identifier + colon at column 0,
          # no parameters. Grab every indented line following one, until the
          # next non-indented, non-comment, non-blank line (next recipe or
          # variable declaration).
          awk '
            /^[a-zA-Z][a-zA-Z0-9_-]*:$/ { flag=1; next }
            /^[^ \t#]/ { flag=0 }
            flag { print }
          ' just/61-donate-clanker.just > recipe_bodies.sh
          bash -n recipe_bodies.sh
          rm -f recipe_bodies.sh

      - name: Lima launcher contract
        run: |
          set -euo pipefail
          JUSTFILE="just/61-donate-clanker.just"
          fail=0

          for want in \
            "ensure_lima()" \
            "brew install lima" \
            "ensure_lima_vm" \
            'lima_args=(start --name "$instance" --tty=false' \
            "template:podman" \
            'limactl shell "$LIMA_INSTANCE" -- "${CONTAINER_ARGS[@]}"' \
            '--volume "${HOME}/.config/hive:/config:ro"' \
            '--volume "${WORKSPACE_TARGET}:/workspace"'; do
            if ! grep -Fq "$want" "$JUSTFILE"; then
              echo "::error file=${JUSTFILE}::missing Lima launch contract: $want"
              fail=1
            fi
          done

          exit "$fail"

      - name: Context7 image contract — goose.yaml and policy
        run: |
          set -euo pipefail
          GOOSE_YAML="image/config/goose.yaml"
          POLICY_MD="image/config/local-agent-policy.md"
          fail=0

          # Required lines in goose.yaml that prove Context7 is configured as
          # an enabled streamable HTTP MCP extension.
          for want in \
            "bundled: false" \
            "enabled: true" \
            "name: context7" \
            "timeout: 30" \
            "type: streamable_http" \
            'uri: "https://mcp.context7.com/mcp"'; do
            if ! grep -qF "$want" "$GOOSE_YAML"; then
              echo "::error file=${GOOSE_YAML}::missing required line: $want"
              fail=1
            fi
          done

          # The local-agent policy must contain an opportunistic-use phrase and
          # a local-fallback phrase so agents do not block on Context7.
          for want in \
            "inspect local repository evidence first" \
            "Context7 only when current external documentation is useful" \
            "continue with local evidence when Context7 is unavailable"; do
            if ! grep -qF "$want" "$POLICY_MD"; then
              echo "::error file=${POLICY_MD}::missing required phrase: $want"
              fail=1
            fi
          done

          exit "$fail"

      - name: Non-thinking model profiles — models.json contract
        run: |
          set -euo pipefail
          MODELS_JSON="image/config/models.json"
          fail=0

          # Reject any profile that sets thinking to true.  jq exits 1 when the
          # select() expression matches, so the pattern is: run jq and invert.
          if thinking_profiles=$(jq -r '
            to_entries[]
            | select(.value.thinking == true)
            | .key' "$MODELS_JSON") \
            && [[ -n "$thinking_profiles" ]]; then
            while IFS= read -r profile; do
              echo "::error file=${MODELS_JSON}::profile $profile has thinking=true"
            done <<< "$thinking_profiles"
            fail=1
          fi

          # Every profile must declare thinking explicitly as false.
          if missing_thinking=$(jq -r '
            to_entries[]
            | select(.value.thinking == null)
            | .key' "$MODELS_JSON") \
            && [[ -n "$missing_thinking" ]]; then
            while IFS= read -r profile; do
              echo "::error file=${MODELS_JSON}::profile $profile is missing explicit thinking: false"
            done <<< "$missing_thinking"
            fail=1
          fi

          # Every profile must have --thinking false in runtime_args.
          no_thinking_flag=$(jq -r '
            to_entries[]
            | select(
                (.value.runtime_args // []) | indices("--thinking") | length == 0
              )
            | .key' "$MODELS_JSON")
          if [[ -n "$no_thinking_flag" ]]; then
            while IFS= read -r profile; do
              echo "::error file=${MODELS_JSON}::profile $profile missing --thinking false in runtime_args"
            done <<< "$no_thinking_flag"
            fail=1
          fi

          exit "$fail"

      - name: Interactive launcher docs and shell stay aligned
        run: |
          set -euo pipefail
          HIVE_PIN="$(sed -n 's/^hive_commit := "\(.*\)"$/\1/p' just/61-donate-clanker.just)"
          test -n "$HIVE_PIN"
          grep -Fq 'tool_order := "claude copilot goose codex"' just/61-donate-clanker.just
          grep -Fq 'Multiple AI CLIs are ready — pick one:' just/61-donate-clanker.just
          grep -Fq 'Goose provider (Esc to leave unset' just/61-donate-clanker.just
          grep -Fq 'LAST_GOOSE_PROVIDER' just/61-donate-clanker.just
          grep -Fq 'last-selections.env' just/61-donate-clanker.just
          grep -Fq 'secrets.env' just/61-donate-clanker.just
          grep -Fq 'fetch --depth 1 origin "$HIVE_COMMIT"' just/61-donate-clanker.just
          grep -Fq 'DONATE_CLANKER_HIVE_COMMIT' just/61-donate-clanker.just
          grep -Fq 'Run: goose configure' just/61-donate-clanker.just
          grep -Fq "$HIVE_PIN" README.md
          grep -Fq 'DONATE_CLANKER_HIVE_COMMIT' README.md
          grep -Fq 'detects every ready CLI' README.md
          grep -Fq 'Goose prompts for its provider and optional model' README.md
          grep -Fq 'last-selections.env' README.md
          grep -Fq 'secrets.env' README.md

      - name: Compatibility image contract and smoke test
        run: |
          set -euo pipefail
          docker build -f image/Containerfile -t donate-clanker-compat:test .
          test "$(docker inspect donate-clanker-compat:test --format '{{.Config.User}}')" = "dev"
          test "$(docker inspect donate-clanker-compat:test --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/donate-clanker-entrypoint"]'
          test "$(docker inspect donate-clanker-compat:test --format '{{.Config.WorkingDir}}')" = "/workspace"
          docker run --rm --entrypoint /bin/sh donate-clanker-compat:test -c '
            set -eu
            test -x /usr/local/bin/donate-clanker-entrypoint
            test ! -S /var/run/docker.sock
            test ! -S /run/podman/podman.sock
          '
          smoke_dir="$PWD/.compat-smoke-config"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          printf '%s\n' \
            'HIVE_REGISTRATION_TOKEN=test-token' \
            'AGENT_BACKEND=definitely-missing-cli' \
            'HIVE_HUB=wss://example.invalid/contribute' \
            > "$smoke_dir/contributor.env"
          set +e
          output="$(docker run --rm \
            -v "$smoke_dir:/config/hive:ro" \
            -v "$PWD:/workspace:ro" \
            donate-clanker-compat:test 2>&1)"
          status=$?
          set -e
          rm -rf "$smoke_dir"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -Fq \
            'definitely-missing-cli CLI not found.'

      # donate-clanker-doctor needs real CLI authentication and a functioning
      # Lima installation, neither of which is meaningful on a hosted runner.
      # The mocked onboarding harness covers the launcher's selection and
      # guest-command construction; local use exercises real readiness.
